<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Live Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Atmosphere</h1>
            <p>Real-time Meteorological Data</p>
        </header>

        <main class="glass-panel">
            <div class="search-section">
                <form id="search-form" class="search-form">
                    <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off" required>
                    <button type="submit" id="search-btn">Search</button>
                </form>
                <div id="error-message" class="error-message"></div>
            </div>

            <div id="weather-display" class="weather-display hidden">
                <div class="location-info">
                    <h2 id="location-name">---</h2>
                    <p id="location-country">---</p>
                </div>
                
                <div class="temperature-container">
                    <h1 id="temperature" class="temperature">--°</h1>
                    <p id="weather-description" class="weather-description">---</p>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Wind Speed</span>
                        <span id="wind-speed" class="metric-value">-- km/h</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Humidity</span>
                        <span id="humidity" class="metric-value">--%</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
